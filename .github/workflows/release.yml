---
name: Release
run-name: "Release (${{ inputs.bump }})"

# Reusable workflow — call from a theme repo with `secrets: inherit`.
# Promotes development → main, deploys to production, and publishes a GitHub Release tagged with the
# current development VERSION. Tags have NO v prefix (e.g. 1.0.0).
#
# Versioning (family-wide — see fireball_orchestrator's versioning.instructions.md): the VERSION
# patch is bumped per merge to development (deploy.yml's build_version job), NOT here. A release
# just promotes + tags. The `bump` input forces a minor/major milestone on development first
# (default: none). Promote + GitHub Release are workflows_common reusables.

on:
  workflow_call:
    inputs:
      version_snippet:
        description: 'Theme snippet file updated by version bumps'
        required: false
        type: string
        default: snippets/fireball-version.liquid
      bump:
        description: 'Milestone bump on development before promoting (none | patch | minor | major)'
        required: false
        type: string
        default: none

jobs:
  # 🔢 Resolve the release version (optional milestone bump; default = promote development as-is)
  version:
    runs-on: ubuntu-latest
    concurrency: version-bump-development  # serialize VERSION changes against deploy.yml's bumps
    permissions:
      contents: read  # pushes go through the bot token, not GITHUB_TOKEN
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      # GITHUB_TOKEN may not push to development (PR-required branch); the bot app
      # bypasses that protection. fireball-actions-bot is installed org-wide.
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: development
          # persist the bot token for git auth — checkout's default GITHUB_TOKEN
          # extraheader overrides any token embedded in a push URL
          token: ${{ steps.bot-token.outputs.token }}

      - name: Milestone bump
        if: ${{ inputs.bump != 'none' }}
        uses: fireballenterprise/workflows_common/actions/bump_version@v1
        with:
          part: ${{ inputs.bump }}

      - name: Resolve version
        id: bump
        env:
          VERSION_SNIPPET: ${{ inputs.version_snippet }}
        run: |
          git config user.name "Levon Becker"
          git config user.email "LevonBecker@users.noreply.github.com"
          new_version="$(cat VERSION)"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          # Self-heal: this file must always exist for git add below to succeed —
          # recreate it if a prior change (e.g. a production-sync PR) deleted it
          if [ ! -f "$VERSION_SNIPPET" ]; then
            mkdir -p "$(dirname "$VERSION_SNIPPET")"
            printf '%s\n' \
              '{%- comment -%}Fireball - Theme version stamp; the version string is auto-updated by the deploy/release workflows{%- endcomment -%}' \
              "<!-- Fireball Dawn Theme v$new_version -->" \
              > "$VERSION_SNIPPET"
          fi
          git add VERSION "$VERSION_SNIPPET"
          # Nothing staged means no bump was requested (or it was a re-run) —
          # skip the commit so the re-run can proceed
          if git diff --cached --quiet; then
            echo "VERSION unchanged at $new_version — promoting as-is"
          else
            # [skip ci]: bot-token pushes DO trigger workflows (unlike GITHUB_TOKEN),
            # so without it this push to development would trigger a dev Deploy
            git commit -m "chore: bump VERSION to $new_version [skip ci]"
            git push origin HEAD:development
          fi

      - name: Report version
        run: echo "### Releasing ${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  # 🔀 Promote development → main (Production)
  promote:
    needs: version
    uses: fireballenterprise/workflows_common/.github/workflows/promote.yml@v1
    secrets: inherit

  # 🚀 Deploy to production
  deploy:
    needs: promote
    uses: fireballenterprise/workflows_shopify/.github/workflows/deploy.yml@v5
    with:
      env: prd
    secrets: inherit

  # 🏷️ Create GitHub Release
  publish_release:
    needs: [version, deploy]
    uses: fireballenterprise/workflows_common/.github/workflows/github_release.yml@v1
    with:
      version: ${{ needs.version.outputs.version }}
      ref: main
      tag: false  # `gh release create` creates the X.Y.Z tag on main as a side effect
      v_prefix: false
    secrets: inherit
