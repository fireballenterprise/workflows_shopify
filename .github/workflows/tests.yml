---
name: Tests
run-name: "Tests (${{ github.head_ref || github.ref_name }})"

# Reusable workflow — call from a theme repo on pull_request. No secrets required.
# A Shopify theme repo is pure content (no Python), so the checks are: Liquid (theme-check),
# YAML (.yamllint), and the workflow files (actionlint).

on:
  workflow_call:

jobs:
  theme_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: theme-check
        uses: fireballenterprise/workflows_shopify/actions/theme-check@v4

  yaml_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Yaml Lint
        run: uvx --from 'yamllint~=1.38' yamllint -c .yamllint .

  action_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: Download actionlint
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Run actionlint
        run: ./actionlint -color
