---
name: Deploy
run-name: "Deploy to ${{ inputs.env || 'dev' }}"

# Reusable workflow — call from a theme repo with `secrets: inherit`.
# Required caller secrets: BOT_PRIVATE_KEY, SHOPIFY_CLI_THEME_TOKEN,
# SHOPIFY_FLAG_STORE, SHOPIFY_THEME_ID_DEV, SHOPIFY_THEME_ID_PRD
# Required caller variable: BOT_APP_ID

on:
  workflow_call:
    inputs:
      env:
        description: 'Environment (dev or prd)'
        required: false
        type: string
        default: dev
      version_snippet:
        description: 'Theme snippet file updated by version bumps'
        required: false
        type: string
        default: snippets/fireball-version.liquid

jobs:
  # 🔢 Bump the VERSION patch (dev deploys only — every merge to development advances the patch)
  build_version:
    if: ${{ (inputs.env || 'dev') == 'dev' }}
    runs-on: ubuntu-latest
    concurrency: version-bump-development  # serialize VERSION bumps — no racing patch numbers
    permissions:
      contents: read  # pushes go through the bot token, not GITHUB_TOKEN
    steps:
      # GITHUB_TOKEN may not push to development (PR-required branch); the bot app
      # bypasses that protection. fireball-actions-bot is installed org-wide.
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: development
          # persist the bot token for git auth — checkout's default GITHUB_TOKEN
          # extraheader overrides any token embedded in a push URL
          token: ${{ steps.bot-token.outputs.token }}

      - name: Bump VERSION patch
        id: bump
        uses: fireballenterprise/workflows_shopify/actions/bump_version@v4
        with:
          part: patch

      - name: Commit VERSION bump
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          new_version="${{ steps.bump.outputs.version }}"
          # Self-heal: this file must always exist for git add below to succeed —
          # recreate it if a prior change (e.g. a production-sync PR) deleted it
          if [ ! -f "${{ inputs.version_snippet }}" ]; then
            mkdir -p "$(dirname "${{ inputs.version_snippet }}")"
            printf '%s\n' \
              '{%- comment -%}Fireball - Theme version stamp; auto-updated by the deploy/release workflows{%- endcomment -%}' \
              "<!-- Fireball Dawn Theme v$new_version -->" \
              > "${{ inputs.version_snippet }}"
          fi
          git add VERSION "${{ inputs.version_snippet }}"
          # [skip ci]: bot-token pushes DO trigger workflows (unlike GITHUB_TOKEN),
          # so without it this push to development would re-run Deploy forever
          git commit -m "chore: bump VERSION to $new_version (dev merge) [skip ci]"
          git push origin HEAD:development

  # 🚀 Deploy job
  deploy:
    needs: build_version
    if: ${{ !cancelled() && !failure() }}  # run even when build_version is skipped (prd), not on its failure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_ENV: ${{ inputs.env || 'dev' }}
      # env on a `uses:` step does not reach a composite action — set the Shopify vars at job level
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
      SHOPIFY_THEME_ID_DEV: ${{ secrets.SHOPIFY_THEME_ID_DEV }}
      SHOPIFY_THEME_ID_PRD: ${{ secrets.SHOPIFY_THEME_ID_PRD }}
    steps:
      - uses: actions/checkout@v7
        with:
          # dev already has build_version's push; prd (called from release.yml) reads main,
          # already finalized by release.yml's version + promote jobs
          ref: ${{ env.DEPLOY_ENV == 'dev' && 'development' || 'main' }}

      # runs can't be renamed after the fact (no such API endpoint, and run-name is
      # fixed at trigger time — before the bump); surface the version in the summary
      - name: Report version
        run: echo "### Deploying $(cat VERSION) to ${{ env.DEPLOY_ENV }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy theme
        uses: fireballenterprise/workflows_shopify/actions/deploy_theme@v4
        with:
          env: ${{ env.DEPLOY_ENV }}
