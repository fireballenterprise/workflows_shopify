---
name: Bump VERSION
description: >-
  Bump the checkout's VERSION file (plain Major.Minor.Patch, no build suffix) and expose the new
  value as an output. Does not commit — the calling workflow owns the git plumbing.

inputs:
  part:
    description: Which component to bump — patch | minor | major
    required: true

outputs:
  version:
    description: The VERSION string after the bump
    value: ${{ steps.bump.outputs.version }}

runs:
  using: composite
  steps:
    - id: bump
      shell: bash
      run: |
        set -euo pipefail
        IFS=. read -r major minor patch <<<"$(cut -d- -f1 < VERSION)"
        case "${{ inputs.part }}" in
          patch) new_version="$major.$minor.$((patch + 1))" ;;
          minor) new_version="$major.$((minor + 1)).0" ;;
          major) new_version="$((major + 1)).0.0" ;;
          *) echo "::error::bump part must be patch | minor | major (got '${{ inputs.part }}')" && exit 1 ;;
        esac
        printf '%s\n' "$new_version" > VERSION
        echo "version=$new_version" >> "$GITHUB_OUTPUT"
        echo "VERSION -> $new_version"
